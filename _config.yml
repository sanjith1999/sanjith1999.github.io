# Site metadata -------------------------------------------------------------
title: Sanjith Shanmugathashan
tagline: DSP / FPGA Engineer
description: >-
  Physical-layer engineering for advanced communication systems — system design,
  MATLAB modelling, RTL development and hardware deployment. Notes and project
  write-ups.
url: "https://sanjith1999.github.io"
baseurl: ""
lang: en

author:
  name: Sanjith Shanmugathashan
  email: shansanjithofficial@gmail.com

# Content -------------------------------------------------------------------
collections:
  ideas:
    output: true
    permalink: /ideas/:name/

# Later entries win when several scopes match, so the collection default
# must come after the site-wide one.
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: ideas
    values:
      layout: idea
      toc: true

# Build ---------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  hard_wrap: false
  # Emits \( \) and \[ \] , which KaTeX auto-render picks up. See README.
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-sitemap   # /sitemap.xml
  - jekyll-feed      # Atom feed of the write-ups

# There are no _posts, so the default /feed.xml would be empty. The write-ups
# live in the ideas collection and get their own feed path.
feed:
  collections:
    ideas:
      path: /ideas/feed.xml

sass:
  style: compressed

exclude:
  - plan/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .jekyll-cache/
