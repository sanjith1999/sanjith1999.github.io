<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-note">© {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
    <ul class="social">
      {%- for link in site.data.social %}
      <li>
        <a href="{{ link.url }}"{% unless link.icon == 'mail' %} target="_blank" rel="noopener"{% endunless %}>
          {% include icon.html name=link.icon %}<span>{{ link.name }}</span>
        </a>
      </li>
      {%- endfor %}
    </ul>
  </div>
</footer>
